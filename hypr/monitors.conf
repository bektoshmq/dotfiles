# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# HCS PXG27QX (EDID serial 0000000000001).
# Match by description so this profile follows the display across ports.
monitor = desc:HCS PXG27QX 0000000000001, 2560x1440@240, auto, 1.1

# Any monitor without a dedicated profile uses its preferred mode and scale.
monitor = , preferred, auto, auto
