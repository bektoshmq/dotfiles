# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Keep every window fully opaque, regardless of focus or fullscreen state.
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    # Keep blur available for translucent apps. Ghostty is the only app with
    # a translucent background, configured in ~/.config/ghostty/config.
    blur {
        enabled = true
        size = 8
        passes = 3
        brightness = 0.85
        contrast = 0.90
        noise = 0.02
        special = false
        popups = false
    }

    # Use round window corners
    # rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# Override Omarchy's per-app and default opacity rules. "override" makes these
# exact values instead of multiplying them with an earlier opacity rule.
windowrule = opacity 1.0 override 1.0 override 1.0 override, match:class .*

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}
