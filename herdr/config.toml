# Keep Herdr's terminal workflow aligned with tmux/tmux.conf.
onboarding = false

[theme]
# Follow Omarchy's terminal palette instead of maintaining a second theme.
name = "terminal"

[terminal]
default_shell = "/usr/bin/bash"
shell_mode = "non_login"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# Session/workspace behavior.
help = "prefix+?"
reload_config = "prefix+r"
detach = ["prefix+d", "alt+d"]
goto = "prefix+s"
workspace_picker = "prefix+w"
new_workspace = ["prefix+shift+n", "alt+shift+c"]
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "alt+shift+h"
next_workspace = "alt+shift+l"
switch_workspace = "alt+shift+1..9"

# Tmux windows map to Herdr tabs.
new_tab = ["prefix+c", "alt+c"]
rename_tab = ["prefix+comma", "alt+comma"]
previous_tab = ["prefix+p", "alt+h"]
next_tab = ["prefix+n", "alt+l"]
switch_tab = ["prefix+1..9", "alt+1..9"]
close_tab = "prefix+shift+x"

# Panes and copy mode.
copy_mode = ["prefix+[", "alt+["]
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
last_pane = ["prefix+o", "alt+o"]
split_horizontal = ["prefix+minus", "alt+minus"]
split_vertical = ["prefix+backslash", "alt+backslash"]
close_pane = ["prefix+x", "alt+x"]
zoom = ["prefix+z", "alt+z"]
resize_mode = "prefix+shift+r"

[ui]
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false
prompt_new_workspace_name = true
pane_borders = true
pane_gaps = false
sidebar_start_collapsed = false
sidebar_collapsed_mode = "hidden"

[ui.sidebar.agents.rows_by_agent]
codex = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
]

[ui.toast]
delivery = "system"
delay_seconds = 1

[advanced]
scrollback_limit_bytes = 64000000

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+s"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"
